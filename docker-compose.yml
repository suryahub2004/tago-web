version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartvital
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  influxdb:
    image: influxdb:2.7-alpine
    ports: ["8086:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: password123
      DOCKER_INFLUXDB_INIT_ORG: smartvital
      DOCKER_INFLUXDB_INIT_BUCKET: health_metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-token
    volumes: [influxdb_data:/var/lib/influxdb2]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports: ["2181:2181"]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes: [kafka_data:/var/lib/kafka/data]
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8090:8080"]
    depends_on: [kafka]
    environment:
      KAFKA_CLUSTERS_0_NAME: smartvital-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_started }
      kafka: { condition: service_healthy }
      redis: { condition: service_started }
      influxdb: { condition: service_started }
    env_file: ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smartvital
      REDIS_URL: redis://redis:6379
      INFLUXDB_URL: http://influxdb:8086
      KAFKA_BROKERS: kafka:29092

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    ports: ["3000:3000"]
    depends_on: [api]
    env_file: ./apps/web/.env.local

volumes:
  postgres_data:
  influxdb_data:
  kafka_data:
